<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>數學學習系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d2d45 0%, #25254f 100%);
            padding: 10px;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: calc(100vh - 20px);
            box-sizing: border-box;
            background: linear-gradient(135deg, #2d2d45 0%, #25254f 100%);
            border-radius: 8px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .home-btn {
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: 600;
        }

        .home-btn:hover {
            background: #45a049;
        }

        .page-title {
            color: #ffcc66;
            font-size: 1.3em;
            font-weight: bold;
        }

        .unit-picker {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e8e8e8;
            max-width: 100%;
        }

        .unit-picker select {
            min-width: 0;
            max-width: 100%;
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #667eea;
            border-radius: 4px;
            background: #2a2a52;
            color: #e8e8e8;
            font-size: 1em;
        }

        .math-container {
            flex: 1;
            overflow-y: auto;
            background: #3a3a52;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            color: #b8b8b8;
            padding: 20px;
        }

        .math-unit-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #000;
            background: #ffa500;
            padding: 10px 15px;
            border-radius: 6px;
            margin: 0 0 6px;
        }

        .math-unit-meta {
            font-size: 1em;
            color: #888;
            margin: 0 0 20px;
        }

        .math-key-points {
            background: #2a2a52;
            border-left: 4px solid #ffcc66;
            border-radius: 8px;
            padding: 16px 18px;
            margin: 0 0 20px;
        }

        .math-key-points-summary {
            font-size: 1.1em;
            color: #e8e8e8;
            line-height: 1.8;
            margin-bottom: 12px;
        }

        .math-key-points-example {
            color: #e8e8e8;
            line-height: 1.8;
            margin-bottom: 8px;
        }

        .math-key-points .math-answer + .math-key-points-example {
            margin-top: 16px;
        }

        .math-question-card {
            background: #2a2a52;
            border-radius: 8px;
            padding: 16px 18px;
            margin: 0 0 16px;
        }

        .math-question-number {
            color: #ffa500;
            font-weight: bold;
        }

        .math-question-text {
            font-size: 1.15em;
            color: #e8e8e8;
            line-height: 1.8;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .math-question-heading {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            align-items: start;
            gap: 8px;
            margin-bottom: 12px;
        }

        .math-star {
            width: 36px;
            height: 36px;
            background: transparent;
            border: 0;
            color: #ffcc66;
            font-size: 1.5em;
            cursor: pointer;
        }

        .math-difficulty {
            display: inline-block;
            margin-right: 8px;
            padding: 3px 8px;
            border-radius: 4px;
            background: #414174;
            color: #fff;
            white-space: nowrap;
        }

        .math-difficulty[data-level="進階"] {
            background: #bbf7d0;
            color: #14532d;
        }

        .math-difficulty[data-level="挑戰"] {
            background: #fecaca;
            color: #7f1d1d;
        }

        #reviewButton[aria-pressed="true"] {
            background: #414174;
        }

        .math-reveal-btn {
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 6px 16px;
            font-size: 0.95em;
            cursor: pointer;
        }

        .math-reveal-btn:hover {
            background: #5568d3;
        }

        .math-solution {
            display: none;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px dashed #4a4a60;
        }

        .math-solution.show {
            display: block;
        }

        .math-solution-label {
            color: #ffcc66;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .math-solution-steps {
            list-style: decimal;
            padding-left: 22px;
            margin: 0 0 12px;
            color: #d8d8d8;
            line-height: 1.8;
        }

        .math-solution-steps li {
            margin-bottom: 4px;
        }

        .math-answer {
            background: #33335c;
            border-radius: 6px;
            padding: 10px 14px;
            color: #4CAF50;
            font-weight: bold;
            font-size: 1.05em;
        }

        .math-hl {
            color: #ff6b6b;
            font-weight: bold;
        }

        .math-pdf-viewer {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .math-pdf-viewer canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 6px;
            background: #fff;
        }

        .math-loading {
            color: #888;
            font-size: 1.1em;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <button class="home-btn" onclick="window.location.href='./index.html'">首頁</button>
            <span class="page-title">📐 數學</span>
            <label class="unit-picker" for="unitSelect">
                <span>單元</span>
                <select id="unitSelect" disabled>
                    <option>載入中...</option>
                </select>
            </label>
            <button type="button" id="reviewButton" class="math-reveal-btn" aria-pressed="false" disabled>複習</button>
            <label class="unit-picker" for="answerSelect">
                <span>解答</span>
                <select id="answerSelect" disabled></select>
            </label>
        </div>

        <div class="math-container" id="mathContainer">
            <div class="math-loading">載入中...</div>
        </div>
    </div>

    <script>
        // 解答 PDF 清單：新增解答時把檔案放進 math/answers/ 並在此加一筆
        const ANSWER_PDFS = [
            { title: '第二回', file: './math/answers/第二回.pdf' }
        ];

        // 用 pdf.js 把每一頁畫成 canvas，讓 iPad／手機能像一般內容一樣捲動（iframe 內嵌 PDF 在 iOS 無法捲動）
        let pdfjsLib = null;
        let pdfRenderToken = 0;

        async function loadPdfjs() {
            if (!pdfjsLib) {
                pdfjsLib = await import('./lib/pdfjs/pdf.min.mjs');
                pdfjsLib.GlobalWorkerOptions.workerSrc = './lib/pdfjs/pdf.worker.min.mjs';
            }
            return pdfjsLib;
        }

        async function renderAnswerPdf(pdf, container) {
            const token = ++pdfRenderToken;
            container.innerHTML = '';
            const viewer = document.createElement('div');
            viewer.className = 'math-pdf-viewer';

            const titleEl = document.createElement('div');
            titleEl.className = 'math-unit-title';
            titleEl.textContent = `${pdf.title} 解答`;

            const status = document.createElement('div');
            status.className = 'math-loading';
            status.textContent = '載入中...';

            viewer.append(titleEl, status);
            container.appendChild(viewer);

            try {
                const lib = await loadPdfjs();
                const doc = await lib.getDocument({ url: pdf.file }).promise;
                if (token !== pdfRenderToken) return doc.destroy();
                status.remove();
                const cssWidth = viewer.clientWidth;
                const dpr = Math.min(window.devicePixelRatio || 1, 3);
                for (let i = 1; i <= doc.numPages; i++) {
                    const page = await doc.getPage(i);
                    if (token !== pdfRenderToken) return doc.destroy();
                    const base = page.getViewport({ scale: 1 });
                    const viewport = page.getViewport({ scale: (cssWidth / base.width) * dpr });
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.floor(viewport.width);
                    canvas.height = Math.floor(viewport.height);
                    canvas.setAttribute('aria-label', `${pdf.title} 解答 第 ${i} 頁`);
                    viewer.appendChild(canvas);
                    await page.render({ canvas, canvasContext: canvas.getContext('2d'), viewport }).promise;
                }
            } catch (err) {
                console.error(err);
                if (token === pdfRenderToken) status.textContent = '❌ 無法顯示解答 PDF';
            }
        }

        async function loadMath() {
            const container = document.getElementById('mathContainer');
            const unitSelect = document.getElementById('unitSelect');
            const reviewButton = document.getElementById('reviewButton');
            try {
                const response = await fetch('./json/math.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const units = await response.json();
                const storageKey = 'mathStarredQuestions';
                const starred = new Set();
                try {
                    const saved = JSON.parse(localStorage.getItem(storageKey));
                    if (Array.isArray(saved)) saved.forEach(id => starred.add(id));
                } catch (err) {
                    console.warn('無法讀取數學星號', err);
                }
                const toggleStar = id => {
                    if (starred.has(id)) starred.delete(id);
                    else starred.add(id);
                    try {
                        localStorage.setItem(storageKey, JSON.stringify([...starred]));
                    } catch (err) {
                        console.warn('無法儲存數學星號', err);
                    }
                };
                unitSelect.innerHTML = '';
                if (!units.length) {
                    unitSelect.add(new Option('尚無單元', ''));
                    container.innerHTML = '<div class="math-loading">尚無單元資料</div>';
                    return;
                }
                units.forEach((unit, index) => {
                    unitSelect.add(new Option(unit.tag || unit.title || `單元 ${index + 1}`, String(index)));
                });
                const answerSelect = document.getElementById('answerSelect');
                ANSWER_PDFS.forEach((pdf, index) => answerSelect.add(new Option(pdf.title, String(index))));
                answerSelect.onchange = () => {
                    const pdf = ANSWER_PDFS[Number(answerSelect.value)];
                    if (!pdf) return show(false);
                    reviewButton.setAttribute('aria-pressed', 'false');
                    reviewButton.textContent = '複習';
                    renderAnswerPdf(pdf, container);
                    container.scrollTop = 0;
                };
                answerSelect.disabled = false;
                const show = reviewing => {
                    answerSelect.selectedIndex = -1;
                    pdfRenderToken++;
                    reviewButton.setAttribute('aria-pressed', String(reviewing));
                    reviewButton.textContent = reviewing ? '返回單元' : '複習';
                    const shownUnits = reviewing ? units : [units[Number(unitSelect.value)]];
                    renderMath(shownUnits, container, starred, toggleStar, reviewing);
                    container.scrollTop = 0;
                };
                unitSelect.onchange = () => show(false);
                reviewButton.onclick = () => show(reviewButton.getAttribute('aria-pressed') !== 'true');
                unitSelect.disabled = false;
                reviewButton.disabled = false;
                unitSelect.value = '0';
                show(false);
            } catch (err) {
                unitSelect.innerHTML = '';
                unitSelect.add(new Option('載入失敗', ''));
                unitSelect.disabled = true;
                container.innerHTML = '<div class="math-loading">❌ 無法讀取 math.json</div>';
                console.error(err);
            }
        }

        // Append text to el, rendering <r>...</r> segments as red highlights (no innerHTML).
        function appendRich(el, text) {
            String(text ?? '').split(/(<r>[\s\S]*?<\/r>)/).forEach(part => {
                if (!part) return;
                const m = part.match(/^<r>([\s\S]*)<\/r>$/);
                if (m) {
                    const span = document.createElement('span');
                    span.className = 'math-hl';
                    span.textContent = m[1];
                    el.appendChild(span);
                } else {
                    el.appendChild(document.createTextNode(part));
                }
            });
            return el;
        }

        function renderKeyPoints(keyPoints) {
            const box = document.createElement('div');
            box.className = 'math-key-points';

            const label = document.createElement('div');
            label.className = 'math-solution-label';
            label.textContent = '重點';
            box.appendChild(label);

            if (keyPoints.summary) {
                const summaryEl = document.createElement('div');
                summaryEl.className = 'math-key-points-summary';
                summaryEl.textContent = keyPoints.summary;
                box.appendChild(summaryEl);
            }

            const examples = keyPoints.examples || (keyPoints.example ? [keyPoints.example] : []);
            examples.forEach((example, i) => {
                const questionEl = document.createElement('div');
                questionEl.className = 'math-key-points-example';
                const tag = document.createElement('span');
                tag.className = 'math-question-number';
                tag.textContent = examples.length > 1 ? `例${i + 1}：` : '例：';
                questionEl.appendChild(tag);
                appendRich(questionEl, example.question);
                box.appendChild(questionEl);

                const stepsList = document.createElement('ol');
                stepsList.className = 'math-solution-steps';
                (example.solution || []).forEach(step => {
                    const li = document.createElement('li');
                    appendRich(li, step);
                    stepsList.appendChild(li);
                });
                box.appendChild(stepsList);

                if (example.answer) {
                    const answerEl = document.createElement('div');
                    answerEl.className = 'math-answer';
                    appendRich(answerEl, `答：${example.answer}`);
                    box.appendChild(answerEl);
                }
            });

            return box;
        }

        function questionKey(unit, question) {
            return JSON.stringify([unit.id, question.number]);
        }

        function renderMath(units, container, starred, toggleStar, reviewing) {
            container.innerHTML = '';

            units.forEach(unit => {
                const questions = (unit.questions || []).filter(q =>
                    !reviewing || starred.has(questionKey(unit, q))
                );
                if (reviewing && !questions.length) return;
                const titleEl = document.createElement('div');
                titleEl.className = 'math-unit-title';
                titleEl.textContent = unit.title;
                container.appendChild(titleEl);

                if (!reviewing && unit.meta) {
                    const metaEl = document.createElement('div');
                    metaEl.className = 'math-unit-meta';
                    metaEl.textContent = unit.meta;
                    container.appendChild(metaEl);
                }

                if (!reviewing && unit.keyPoints) {
                    container.appendChild(renderKeyPoints(unit.keyPoints));
                }

                questions.forEach(q => {
                    const card = document.createElement('div');
                    card.className = 'math-question-card';

                    const questionEl = document.createElement('div');
                    questionEl.className = 'math-question-text';
                    const numberSpan = document.createElement('span');
                    numberSpan.className = 'math-question-number';
                    numberSpan.textContent = `${q.number}. `;
                    const star = document.createElement('button');
                    star.type = 'button';
                    star.className = 'math-star';
                    star.setAttribute('aria-label', `標記第 ${q.number} 題以供複習`);
                    const key = questionKey(unit, q);
                    const refreshStar = () => {
                        const active = starred.has(key);
                        star.textContent = active ? '★' : '☆';
                        star.setAttribute('aria-pressed', String(active));
                    };
                    star.onclick = () => {
                        toggleStar(key);
                        refreshStar();
                    };
                    refreshStar();

                    const difficulty = document.createElement('span');
                    difficulty.className = 'math-difficulty';
                    difficulty.textContent = q.difficulty;
                    difficulty.dataset.level = q.difficulty;
                    questionEl.append(difficulty, numberSpan);
                    appendRich(questionEl, q.question);

                    const heading = document.createElement('div');
                    heading.className = 'math-question-heading';
                    heading.append(star, questionEl);
                    card.appendChild(heading);

                    const revealBtn = document.createElement('button');
                    revealBtn.className = 'math-reveal-btn';
                    revealBtn.textContent = '顯示詳解';

                    const solutionEl = document.createElement('div');
                    solutionEl.className = 'math-solution';

                    const solutionLabel = document.createElement('div');
                    solutionLabel.className = 'math-solution-label';
                    solutionLabel.textContent = '詳解';
                    solutionEl.appendChild(solutionLabel);

                    const stepsList = document.createElement('ol');
                    stepsList.className = 'math-solution-steps';
                    (q.solution || []).forEach(step => {
                        const li = document.createElement('li');
                        appendRich(li, step);
                        stepsList.appendChild(li);
                    });
                    solutionEl.appendChild(stepsList);

                    const answerEl = document.createElement('div');
                    answerEl.className = 'math-answer';
                    appendRich(answerEl, `答：${q.answer}`);
                    solutionEl.appendChild(answerEl);

                    revealBtn.onclick = () => {
                        const showing = solutionEl.classList.toggle('show');
                        revealBtn.textContent = showing ? '隱藏詳解' : '顯示詳解';
                    };

                    card.appendChild(revealBtn);
                    card.appendChild(solutionEl);
                    container.appendChild(card);
                });
            });
            if (reviewing && !container.firstChild) {
                container.innerHTML = '<div class="math-loading">目前沒有加星號的題目</div>';
            }
        }

        loadMath();
    </script>
</body>
</html>
